<script>
function openGame(url, title) {
  var newTab = window.open('about:blank', '_blank');
  newTab.document.write(`
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

      </style>
    </head>
    <body>
      <iframe src="${url}" frameborder="0"></iframe>
    </body>
    </html>
  `);
  newTab.document.close();
}
</script>
<script>
const rainbowElements = document.querySelectorAll(
    '.rainbow-text, .rainbow-text-creator, [class*="rainbow-text"]'
);

rainbowElements.forEach(text => {

    text.style.cursor = "pointer";

    let clicked = false;

    text.addEventListener("click", () => {

        // stop THIS text from being clicked again
        if (clicked) return;

        clicked = true;

        // disable only this one
        text.style.pointerEvents = "none";
        text.style.cursor = "default";

        // disappear effect
        text.classList.add("disappear");
    });

});
</script>
<style>
.disappear{
    animation: vanish 1s forwards;
}

@keyframes vanish{
    0%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(0);
    }
}
