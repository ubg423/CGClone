<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Time Control</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; font-family:Arial,sans-serif; }
    #game-container { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; background:#000; overflow:hidden; }
    #unity-canvas { display:block; width:100%; height:100%; background:#000; outline:none; }
    #loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff; background:#000; z-index:2; padding:20px; }
    #loading.hidden { display:none; }
    #loading-title { font-size:clamp(20px,4vw,32px); font-weight:700; text-align:center; }
    #progress-track { width:min(420px,75vw); height:10px; border-radius:20px; background:#333; overflow:hidden; }
    #progress-bar { width:0%; height:100%; background:#19a7ff; transition:width .15s; }
    #status { color:#bbb; font-size:13px; text-align:center; max-width:90vw; overflow-wrap:anywhere; }
    #fullscreen { position:absolute; top:max(12px,env(safe-area-inset-top)); right:max(12px,env(safe-area-inset-right)); z-index:3; border:1px solid #ffffff55; border-radius:8px; background:#111c; color:#fff; padding:10px 14px; font-size:14px; cursor:pointer; }
    #error { display:none; position:absolute; left:5%; right:5%; bottom:5%; z-index:4; padding:12px; color:#fff; background:#8b0000; border-radius:8px; white-space:pre-wrap; font-size:13px; max-height:45%; overflow:auto; }
  </style>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
  <main id="game-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
          <div id="sdk-environment"
     style="color:yellow;font-size:14px;">
  Checking CrazyGames SDK...
</div>
      <div id="loading-title">Loading Time Control...</div>
      <div id="progress-track"><div id="progress-bar"></div></div>
      <div id="status">Preparing game...</div>
    </div>
    <button id="fullscreen" type="button">⛶ Fullscreen</button>
    <div id="error"></div>
  </main>

  <script>
    'use strict';

    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status');
    const errorBox = document.getElementById('error');
const crazyGamesReady = (async function checkCrazyGamesEnvironment() {
  const display = document.getElementById('sdk-environment');

  try {
    if (!window.CrazyGames?.SDK) {
      display.textContent = 'CrazyGames SDK not detected';
      return 'missing';
    }

    await window.CrazyGames.SDK.init();

    const environment = window.CrazyGames.SDK.environment;

    display.textContent = 'CrazyGames environment: ' + environment;

    console.log('INITIALIZED SDK ENVIRONMENT:', environment);

    return environment;

  } catch (error) {
    display.textContent = 'SDK initialization failed: ' + error.message;
    console.error('SDK initialization error:', error);

    return 'initialization failed';
  }
})();
    const fullscreenButton = document.getElementById('fullscreen');

    const buildUrl = './Build/';

    // Expected files in Build/:
    // TCT_0_3_2_CG3.data.br.part001, .part002, .part003
    const DATA_BASE = buildUrl + 'TCT_0_3_2_CG3.data.br';
    const DATA_PARTS = 3;

    // Expected files in Build/:
    // TCT_0_3_2_CG3.wasm.br.part001, .part002, .part003
    const WASM_BASE = buildUrl + 'TCT_0_3_2_CG3.wasm.br';
    const WASM_PARTS = 3;

    const FRAMEWORK_FILE = buildUrl + 'TCT_0_3_2_CG3.framework.js.br';
    const LOADER_FILE = buildUrl + 'TCT_0_3_2_CG3.loader.js';

    const temporaryUrls = [];
    let unityInstance = null;
    let startGameCalled = false;

    function setProgress(percent, message) {
      progressBar.style.width = Math.max(0, Math.min(100, percent)) + '%';
      statusText.textContent = message;
    }

    function showError(message) {
      errorBox.style.display = 'block';
      errorBox.textContent = 'The game could not be loaded.\n\n' + message;
      statusText.textContent = 'Loading failed.';
      console.error('TIME CONTROL LOAD ERROR:', message);
    }

    function startsWithBytes(bytes, signature) {
      if (bytes.length < signature.length) return false;
      return signature.every((value, index) => bytes[index] === value);
    }

    function isReadableText(bytes) {
      const sample = bytes.subarray(0, Math.min(bytes.length, 512));
      if (!sample.length) return false;
      let acceptable = 0;
      for (const value of sample) {
        if (value === 9 || value === 10 || value === 13 || (value >= 32 && value <= 126)) acceptable++;
      }
      return acceptable / sample.length > 0.92;
    }

    async function fetchPart(baseFile, number, total) {
      const suffixes = [String(number).padStart(3, '0'), String(number).padStart(2, '0')];
      let lastError = null;

      for (const suffix of suffixes) {
        const url = baseFile + '.part' + suffix;
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) {
            lastError = new Error('HTTP ' + response.status + ' for ' + url);
            if (response.status === 404) continue;
            throw lastError;
          }

          const bytes = new Uint8Array(await response.arrayBuffer());
          if (!bytes.length) throw new Error('Part is empty: ' + url);
          console.log('Downloaded', url, bytes.byteLength, 'bytes');
          return bytes;
        } catch (error) {
          lastError = error;
          if (String(error.message).includes('404')) continue;
          throw error;
        }
      }

      throw new Error(
        'Missing part ' + number + ' of ' + total + '. Tried both .part' +
        suffixes.join(' and .part') + ' for ' + baseFile + '. Last error: ' +
        (lastError?.message || 'not found')
      );
    }

    async function loadSplitFile(baseFile, count, label, startPercent, endPercent) {
      const chunks = new Array(count);
      let received = 0;
      let totalBytes = 0;

      for (let first = 1; first <= count; first += 4) {
        const last = Math.min(first + 3, count);
        const results = await Promise.all(
          Array.from({ length: last - first + 1 }, (_, index) => {
            const number = first + index;
            return fetchPart(baseFile, number, count).then(bytes => ({ number, bytes }));
          })
        );

        for (const item of results) {
          chunks[item.number - 1] = item.bytes;
          received++;
          totalBytes += item.bytes.byteLength;
        }

        const fraction = received / count;
        setProgress(
          startPercent + fraction * (endPercent - startPercent),
          'Downloading ' + label + ' parts: ' + received + '/' + count
        );
      }

      const joined = new Uint8Array(totalBytes);
      let offset = 0;
      for (const chunk of chunks) {
        if (!chunk) throw new Error(label + ' has a missing chunk.');
        joined.set(chunk, offset);
        offset += chunk.byteLength;
      }

      console.log(label + ' joined size:', joined.byteLength, 'bytes');
      return joined;
    }

    function makeObjectUrl(bytes, mime) {
      const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
      temporaryUrls.push(url);
      return url;
    }

    async function getBrotliDecoder() {
      const module = await import('https://unpkg.com/brotli-wasm@3.0.1/index.web.js?module');
      return await module.default;
    }

    async function decompressIfBrotli(bytes, brotli, label, rawCheck) {
      if (rawCheck(bytes)) return bytes;

      try {
        const output = new Uint8Array(brotli.decompress(bytes));
        if (!output.length) throw new Error('Decompression produced an empty file.');
        console.log(label + ' decompressed size:', output.byteLength, 'bytes');
        return output;
      } catch (error) {
        if (isReadableText(bytes)) return bytes;
        throw new Error(
          label + ' is not the expected raw file and could not be Brotli-decompressed: ' +
          error.message
        );
      }
    }

    async function startGame() {
      if (startGameCalled) return;
      startGameCalled = true;

      let initTimeout = null;

      try {
        if (location.protocol === 'file:') {
          throw new Error(
            'Do not open this HTML by double-clicking it. Run it through a web server, ' +
            'or upload the HTML and Build folder to GitHub Pages. For local testing, ' +
            'open PowerShell in the game folder and run: python -m http.server 8000, ' +
            'then visit http://localhost:8000.'
          );
        }

        setProgress(1, 'Loading Brotli decoder...');
        console.log('Loading Brotli decoder...');
        const brotli = await getBrotliDecoder();

        setProgress(3, 'Downloading DATA parts...');
        const dataReceived = await loadSplitFile(DATA_BASE, DATA_PARTS, 'DATA', 3, 35);
        const dataBytes = await decompressIfBrotli(
          dataReceived,
          brotli,
          'DATA',
          bytes => startsWithBytes(bytes, [
            0x55,0x6E,0x69,0x74,0x79,0x57,0x65,
            0x62,0x44,0x61,0x74,0x61,0x31,0x2E,0x30
          ])
        );

        setProgress(36, 'Downloading WASM parts...');
        const wasmReceived = await loadSplitFile(WASM_BASE, WASM_PARTS, 'WASM', 36, 72);
        const wasmBytes = await decompressIfBrotli(
          wasmReceived,
          brotli,
          'WASM',
          bytes => startsWithBytes(bytes, [0x00,0x61,0x73,0x6D])
        );

        if (!startsWithBytes(wasmBytes, [0x00,0x61,0x73,0x6D])) {
          const firstBytes = Array.from(wasmBytes.subarray(0, 16), byte =>
            byte.toString(16).padStart(2, '0').toUpperCase()
          ).join(' ');
          throw new Error('WASM is not a binary WebAssembly file. First bytes: ' + firstBytes);
        }

        setProgress(73, 'Downloading Unity framework...');
        console.log('Downloading framework:', FRAMEWORK_FILE);
        const frameworkResponse = await fetch(FRAMEWORK_FILE, { cache: 'no-store' });
        if (!frameworkResponse.ok) {
          throw new Error('Could not fetch framework file: ' + FRAMEWORK_FILE +
            ' (HTTP ' + frameworkResponse.status + ')');
        }

        const frameworkReceived = new Uint8Array(await frameworkResponse.arrayBuffer());
        if (!frameworkReceived.length) throw new Error('Framework file is empty.');
        const frameworkBytes = await decompressIfBrotli(
          frameworkReceived,
          brotli,
          'FRAMEWORK',
          isReadableText
        );

        console.log('DATA ready:', dataBytes.length, 'bytes');
        console.log('WASM ready:', wasmBytes.length, 'bytes');
        console.log('FRAMEWORK ready:', frameworkBytes.length, 'bytes');

        setProgress(88, 'Preparing Unity...');
        const config = {
          dataUrl: makeObjectUrl(dataBytes, 'application/octet-stream'),
          frameworkUrl: makeObjectUrl(frameworkBytes, 'application/javascript'),
          codeUrl: makeObjectUrl(wasmBytes, 'application/wasm'),
          streamingAssetsUrl: buildUrl + 'StreamingAssets',
          companyName: 'CrazyGames',
          productName: 'Time Control',
          productVersion: '2'
        };

        if (typeof createUnityInstance !== 'function') {
          throw new Error('Unity loader loaded, but createUnityInstance was not found.');
        }

        console.log('Starting Unity initialization...');
        initTimeout = setTimeout(() => {
          console.warn('Unity initialization is taking longer than 60 seconds.');
          statusText.textContent = 'Unity is taking longer than expected...';
        }, 60000);

        unityInstance = await createUnityInstance(canvas, config, progress => {
          console.log('UNITY PROGRESS:', progress);
          setProgress(
            88 + progress * 12,
            'Starting game... ' + Math.round(progress * 100) + '%'
          );
        });

        clearTimeout(initTimeout);
        initTimeout = null;
        window.unityInstance = unityInstance;
        console.log('UNITY INITIALIZED SUCCESSFULLY');
        loading.classList.add('hidden');
        resizeGame();

      } catch (error) {
        if (initTimeout !== null) clearTimeout(initTimeout);
        console.error('GAME LOADING FAILED:', error);
        showError(error?.stack || error?.message || String(error));
      }
    }

    // Load the Unity loader exactly once.
    const unityLoaderScript = document.createElement('script');
    unityLoaderScript.src = LOADER_FILE;
    unityLoaderScript.onload = () => {
      console.log('Unity loader script loaded.');
      startGame();
    };
    unityLoaderScript.onerror = () => {
      showError('Could not load Unity loader: ' + LOADER_FILE +
        '. Check that TCT_0_3_2_CG3.loader.js exists inside Build/.');
    };
    document.head.appendChild(unityLoaderScript);

    function resizeGame() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(canvas.clientWidth * ratio);
      canvas.height = Math.round(canvas.clientHeight * ratio);
    }

    window.addEventListener('resize', resizeGame);
    window.addEventListener('orientationchange', () => setTimeout(resizeGame, 150));

    fullscreenButton.addEventListener('click', async () => {
      try {
        const target = document.getElementById('game-container');
        if (!document.fullscreenElement) {
          await target.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        showError('Fullscreen is not available: ' + (error.message || String(error)));
      }
    });

    document.addEventListener('fullscreenchange', () => {
      fullscreenButton.textContent = document.fullscreenElement ? '✕ Exit fullscreen' : '⛶ Fullscreen';
      setTimeout(resizeGame, 100);
    });

    window.addEventListener('beforeunload', () => {
      temporaryUrls.forEach(url => URL.revokeObjectURL(url));
    });

    window.addEventListener('error', event => {
      console.error('Browser error:', event.message, event.filename, event.lineno);
    });

    window.addEventListener('unhandledrejection', event => {
      console.error('Unhandled promise rejection:', event.reason);
    });
  </script>
</body>
</html>
