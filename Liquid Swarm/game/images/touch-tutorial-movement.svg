<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480"
                 width="240" height="240" role="img" aria-label="Touch and drag to move">
    <defs>
        <filter id="handShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.28" />
        </filter>
        <style>
            /* ===== TIMING: one full loop = 3.4s ===== */
            #gesture {
            animation: travel 3.4s cubic-bezier(.45,0,.25,1) infinite;
            }

            #press {
            animation: press 3.4s ease-in-out infinite;
            transform-origin: 0 0;
            }

            #ripple {
            animation: ripple 3.4s ease-out infinite;
            transform-origin: 0 0;
            }

            #ripple2 {
            animation: ripple 3.4s ease-out infinite;
            transform-origin: 0 0;
            }

            #trail {
            animation: trail 3.4s cubic-bezier(.45,0,.25,1) infinite;
            }

            /* hand fades in, drags to the right, fades out */
            @keyframes travel {
            0% {
            transform: translate(70px, 210px);
            opacity: 0;
            }

            8% {
            transform: translate(70px, 210px);
            opacity: 1;
            }

            26% {
            transform: translate(70px, 210px);
            opacity: 1;
            }

            70% {
            transform: translate(370px, 210px);
            opacity: 1;
            }

            86% {
            transform: translate(370px, 210px);
            opacity: 1;
            }

            96% {
            transform: translate(370px, 210px);
            opacity: 0;
            }

            100% {
            transform: translate(70px, 210px);
            opacity: 0;
            }
            }
            /* the little "tap down" nudge */
            @keyframes press {
            0%, 12% {
            transform: translateY(-6px);
            }

            20%, 72% {
            transform: translateY(0px);
            }

            80%,100% {
            transform: translateY(-6px);
            }
            }
            /* ripple pulse on touchdown */
            @keyframes ripple {
            0%, 14% {
            transform: scale(0.2);
            opacity: 0;
            }

            22% {
            transform: scale(1);
            opacity: 0.9;
            }

            40% {
            transform: scale(1.9);
            opacity: 0;
            }

            100% {
            transform: scale(1.9);
            opacity: 0;
            }
            }
            /* the drag trail draws in as the hand moves */
            @keyframes trail {
            0%, 22% {
            stroke-dashoffset: 300;
            opacity: 0;
            }

            26% {
            stroke-dashoffset: 300;
            opacity: 1;
            }

            70% {
            stroke-dashoffset: 0;
            opacity: 1;
            }

            92% {
            stroke-dashoffset: 0;
            opacity: 0;
            }

            100% {
            stroke-dashoffset: 300;
            opacity: 0;
            }
            }
        </style>
    </defs>

    <!-- drag trail (start -> end), drawn horizontally to the right -->
    <path id="trail" d="M 70 210 L 370 210"
          fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="300" stroke-dashoffset="300" />
    <circle cx="70" cy="210" r="4" fill="#38bdf8" opacity="0.6" />

    <!-- the moving gesture: ripple + hand share the contact point at local (0,0) -->
    <g id="gesture">
        <circle id="ripple" cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="3" />
        <circle id="ripple2" cx="0" cy="0" r="9" fill="#38bdf8" opacity="0.18" />

        <!-- hand: index finger extended (tip at 0,0), thumb below-left, curled fingers to the right -->
        <g id="press" filter="url(#handShadow)">
            <!-- palm / fist -->
            <rect x="-10" y="40" width="64" height="58" rx="24"
                  fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <!-- curled fingers (middle / ring / pinky) -->
            <circle cx="15" cy="42" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <circle cx="31" cy="42" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <circle cx="46" cy="44" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <!-- thumb -->
            <rect x="-24" y="56" width="14" height="30" rx="7"
                  transform="rotate(-35 -17 71)"
                  fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <!-- index finger (tip at 0,0) -->
            <rect x="-9" y="-2" width="18" height="50" rx="9"
                  fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
        </g>
    </g>
</svg>