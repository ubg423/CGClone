
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MX Offroad</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      outline: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #fff;
      background: #000;
      z-index: 2;
      padding: 20px;
    }

    #loading.hidden {
      display: none;
    }

    #loading-title {
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 700;
      text-align: center;
    }

    #progress-track {
      width: min(420px, 75vw);
      height: 10px;
      border-radius: 20px;
      background: #333;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #19a7ff;
      transition: width .15s;
    }

    #status {
      color: #bbb;
      font-size: 13px;
      text-align: center;
      max-width: 90vw;
      overflow-wrap: anywhere;
    }

    #fullscreen {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 5;
      border: 1px solid #ffffff55;
      border-radius: 8px;
      background: #111c;
      color: #fff;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    #error {
      display: none;
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 5%;
      z-index: 10;
      padding: 12px;
      color: #fff;
      background: #8b0000;
      border-radius: 8px;
      white-space: pre-wrap;
      font-size: 13px;
      max-height: 45%;
      overflow: auto;
    }
  </style>
</head>

<body>
  <main id="game-container">

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loading">
      <div id="loading-title">Loading Game...</div>

      <div id="progress-track">
        <div id="progress-bar"></div>
      </div>

      <div id="status">Starting game...</div>
    </div>

    <button id="fullscreen">⛶ Fullscreen</button>

    <div id="error"></div>
  </main>

  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status');
    const errorBox = document.getElementById('error');

    const buildUrl = './Build/';

    // DATA FILE
    const DATA_BASE =
      buildUrl + '47afacdf238bd338eccf531e71f9500d.data.br';

    const DATA_PARTS = 4;

    // WASM FILE
    const WASM_BASE =
      buildUrl + '6623c976fcd570ea7c7632bcabd13cd2.wasm.br';

    const WASM_PARTS = 3;

    // UNITY FILES
    const FRAMEWORK_FILE =
      buildUrl + 'bf9572c66bb4a23b642fa3509dc57166.js.br';

    const LOADER_FILE =
      buildUrl + '962b15be668bc5114f6e2305562e0c45.js';

    const temporaryUrls = [];

    let unityInstance = null;
    let gameStarted = false;


    // --------------------------------------------------
    // CRAZYGAMES SDK COMPATIBILITY
    // --------------------------------------------------

    // These methods prevent missing CrazyGames SDK globals
    // from immediately breaking a standalone version.

    window.Crazygames = {
      load: function() {},
      init: function(options) {
        console.log('CrazyGames SDK init requested:', options);
      },
      requestAd: function() {},
      happytime: function() {},
      gameplayStart: function() {},
      gameplayStop: function() {},
      sdkGameLoadingStart: function() {},
      sdkGameLoadingStop: function() {},
      requestInviteUrl: function() {},
      requestBanners: function() {},
      screenshotReceived: function() {},
      constants: [],
      getUnityInstance: function() {
        return unityInstance;
      }
    };

    window.CrazySDK = {
      init: function(options) {
        return window.Crazygames.init(options);
      },
      requestAd: function() {
        return window.Crazygames.requestAd.apply(
          window.Crazygames, arguments
        );
      }
    };


    // --------------------------------------------------
    // PROGRESS AND ERRORS
    // --------------------------------------------------

    function setProgress(percent, message) {
      progressBar.style.width =
        Math.max(0, Math.min(100, percent)) + '%';

      statusText.textContent = message;
    }

    function showError(message) {
      console.error(message);

      errorBox.style.display = 'block';

      errorBox.textContent =
        'The game could not be loaded.\n\n' + message;

      statusText.textContent = 'Loading failed.';
    }

    window.addEventListener('error', function(event) {
      console.error('JavaScript error:', event.error || event.message);
    });

    window.addEventListener('unhandledrejection', function(event) {
      console.error('Unhandled promise rejection:', event.reason);
    });


    // --------------------------------------------------
    // WEBGL 2 CHECK
    // --------------------------------------------------

    function checkWebGL2() {
      const testCanvas = document.createElement('canvas');

      const gl = testCanvas.getContext('webgl2', {
        failIfMajorPerformanceCaveat: false
      });

      if (!gl) {
        throw new Error(
          'MX Offroad requires WebGL 2.0, but your browser or graphics ' +
          'driver could not create a WebGL 2 context. Try enabling ' +
          'hardware acceleration in Chrome and updating your graphics driver.'
        );
      }

      const renderer = gl.getExtension('WEBGL_debug_renderer_info');

      if (renderer) {
        console.log(
          'Graphics renderer:',
          gl.getParameter(renderer.UNMASKED_RENDERER_WEBGL)
        );
      }

      console.log('WebGL 2 is supported.');

      gl.getExtension('WEBGL_lose_context')?.loseContext();
    }


    // --------------------------------------------------
    // FILE HELPERS
    // --------------------------------------------------

    function startsWithBytes(bytes, signature) {
      if (bytes.length < signature.length) return false;

      return signature.every(
        (value, index) => bytes[index] === value
      );
    }

    function isReadableText(bytes) {
      const sample = bytes.subarray(
        0,
        Math.min(bytes.length, 512)
      );

      if (!sample.length) return false;

      let acceptable = 0;

      for (const value of sample) {
        if (
          value === 9 ||
          value === 10 ||
          value === 13 ||
          (value >= 32 && value <= 126)
        ) {
          acceptable++;
        }
      }

      return acceptable / sample.length > 0.92;
    }


    // --------------------------------------------------
    // DOWNLOAD SPLIT FILES
    // --------------------------------------------------

    async function fetchPart(baseFile, number, total) {
      const suffixes = [
        String(number).padStart(3, '0'),
        String(number).padStart(2, '0')
      ];

      let lastError;

      for (const suffix of suffixes) {
        const url = baseFile + '.part' + suffix;

        try {
          const response = await fetch(url, {
            cache: 'no-store'
          });

          if (!response.ok) {
            lastError = new Error(
              'HTTP ' + response.status + ' for ' + url
            );

            if (response.status === 404) continue;

            throw lastError;
          }

          const bytes = new Uint8Array(
            await response.arrayBuffer()
          );

          if (!bytes.length) {
            throw new Error('Part is empty: ' + url);
          }

          return bytes;

        } catch (error) {
          lastError = error;

          if (String(error.message).includes('404')) {
            continue;
          }

          throw error;
        }
      }

      throw new Error(
        'Missing part ' + number + ' of ' + total +
        '. Last error: ' +
        (lastError?.message || 'Not found')
      );
    }


    async function loadSplitFile(
      baseFile,
      count,
      label,
      startPercent,
      endPercent
    ) {
      const chunks = new Array(count);

      let received = 0;
      let totalBytes = 0;

      for (let first = 1; first <= count; first += 4) {
        const last = Math.min(first + 3, count);

        const results = await Promise.all(
          Array.from(
            { length: last - first + 1 },
            (_, index) => {
              const number = first + index;

              return fetchPart(
                baseFile,
                number,
                count
              ).then(bytes => ({
                number,
                bytes
              }));
            }
          )
        );

        for (const item of results) {
          chunks[item.number - 1] = item.bytes;

          received++;
          totalBytes += item.bytes.byteLength;
        }

        const fraction = received / count;

        setProgress(
          startPercent +
          fraction * (endPercent - startPercent),

          'Downloading ' + label + ' parts: ' +
          received + '/' + count
        );
      }

      const joined = new Uint8Array(totalBytes);

      let offset = 0;

      for (const chunk of chunks) {
        if (!chunk) {
          throw new Error(label + ' has a missing chunk.');
        }

        joined.set(chunk, offset);
        offset += chunk.byteLength;
      }

      return joined;
    }


    // --------------------------------------------------
    // BROTLI
    // --------------------------------------------------

    function makeObjectUrl(bytes, mime) {
      const url = URL.createObjectURL(
        new Blob([bytes], { type: mime })
      );

      temporaryUrls.push(url);

      return url;
    }

    async function getBrotliDecoder() {
      const module = await import(
        'https://unpkg.com/brotli-wasm@3.0.1/index.web.js?module'
      );

      return await module.default;
    }

    async function decompressIfBrotli(
      bytes,
      brotli,
      label,
      rawCheck
    ) {
      if (rawCheck(bytes)) return bytes;

      try {
        const output = new Uint8Array(
          brotli.decompress(bytes)
        );

        if (!output.length) {
          throw new Error('Decompression produced an empty file.');
        }

        return output;

      } catch (error) {
        if (isReadableText(bytes)) return bytes;

        throw new Error(
          label +
          ' is not a valid complete Brotli stream. ' +
          error.message
        );
      }
    }


    // --------------------------------------------------
    // START UNITY
    // --------------------------------------------------

    async function startGame() {
      if (gameStarted) return;

      gameStarted = true;

      try {
        setProgress(1, 'Checking graphics support...');

        checkWebGL2();

        setProgress(2, 'Loading Brotli decoder...');

        const brotli = await getBrotliDecoder();


        // DATA
        setProgress(3, 'Downloading DATA parts...');

        const dataReceived = await loadSplitFile(
          DATA_BASE,
          DATA_PARTS,
          'DATA',
          3,
          35
        );

        const dataBytes = await decompressIfBrotli(
          dataReceived,
          brotli,
          'DATA',
          bytes => startsWithBytes(bytes, [
            0x55, 0x6E, 0x69, 0x74,
            0x79, 0x57, 0x65, 0x62,
            0x44, 0x61, 0x74, 0x61,
            0x31, 0x2E, 0x30
          ])
        );


        // WASM
        setProgress(36, 'Downloading WASM parts...');

        const wasmReceived = await loadSplitFile(
          WASM_BASE,
          WASM_PARTS,
          'WASM',
          36,
          72
        );

        const wasmBytes = await decompressIfBrotli(
          wasmReceived,
          brotli,
          'WASM',
          bytes => startsWithBytes(bytes, [
            0x00, 0x61, 0x73, 0x6D
          ])
        );

        if (!startsWithBytes(wasmBytes, [
          0x00, 0x61, 0x73, 0x6D
        ])) {
          throw new Error(
            'The joined WASM file does not have a valid WebAssembly signature. ' +
            'Check that the WASM parts are correct and in the right order.'
          );
        }


        // FRAMEWORK
        setProgress(73, 'Downloading Unity framework...');

        const frameworkResponse = await fetch(
          FRAMEWORK_FILE,
          { cache: 'no-store' }
        );

        if (!frameworkResponse.ok) {
          throw new Error(
            'Could not fetch framework file: ' +
            FRAMEWORK_FILE +
            ' (HTTP ' + frameworkResponse.status + ')'
          );
        }

        const frameworkReceived = new Uint8Array(
          await frameworkResponse.arrayBuffer()
        );

        const frameworkBytes = await decompressIfBrotli(
          frameworkReceived,
          brotli,
          'FRAMEWORK',
          isReadableText
        );


        // UNITY CONFIG
        setProgress(88, 'Preparing Unity...');

        const config = {
          dataUrl: makeObjectUrl(
            dataBytes,
            'application/octet-stream'
          ),

          frameworkUrl: makeObjectUrl(
            frameworkBytes,
            'application/javascript'
          ),

          codeUrl: makeObjectUrl(
            wasmBytes,
            'application/wasm'
          ),

          streamingAssetsUrl: buildUrl + 'StreamingAssets/',

          companyName: 'MX Offroad',
          productName: 'MX Offroad',
          productVersion: '1.0',

          matchWebGLToCanvasSize: true,

          devicePixelRatio: Math.min(
            window.devicePixelRatio || 1,
            2
          ),

          webglContextAttributes: {
            preserveDrawingBuffer: false,
            powerPreference: 'default',
            failIfMajorPerformanceCaveat: false
          },

          showBanner: function(message, type) {
            console[type === 'error' ? 'error' : 'warn'](
              'Unity:', message
            );

            if (type === 'error') {
              showError(message);
            }
          }
        };


        if (typeof createUnityInstance !== 'function') {
          throw new Error(
            'Unity loader loaded, but createUnityInstance was not found.'
          );
        }


        // START GAME
        console.log('Starting MX Offroad Unity instance...');

        const instance = await createUnityInstance(
          canvas,
          config,
          progress => {
            setProgress(
              88 + progress * 12,
              'Starting game... ' +
              Math.round(progress * 100) + '%'
            );
          }
        );

        unityInstance = instance;
        window.unityInstance = instance;

        console.log('Unity initialized successfully.');
        console.log('Unity instance:', instance);

        loading.classList.add('hidden');

      } catch (error) {
        console.error('Game loading failed:', error);

        showError(
          error?.stack || error?.message || String(error)
        );
      }
    }


    // --------------------------------------------------
    // LOAD UNITY LOADER
    // --------------------------------------------------

    const loader = document.createElement('script');

    loader.src = LOADER_FILE;

    loader.onload = startGame;

    loader.onerror = function() {
      showError(
        'Could not load Unity loader: ' +
        LOADER_FILE +
        '. Check that it exists in Build/.'
      );
    };

    document.head.appendChild(loader);


    // --------------------------------------------------
    // FULLSCREEN
    // --------------------------------------------------

    document.getElementById('fullscreen').addEventListener(
      'click',
      async function() {
        try {
          const target = document.getElementById('game-container');

          if (!document.fullscreenElement) {
            await target.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }

        } catch (error) {
          showError(
            'Fullscreen is not available: ' + error.message
          );
        }
      }
    );

    document.addEventListener('fullscreenchange', function() {
      document.getElementById('fullscreen').textContent =
        document.fullscreenElement
          ? '✕ Exit fullscreen'
          : '⛶ Fullscreen';
    });


    // --------------------------------------------------
    // CLEANUP
    // --------------------------------------------------

    window.addEventListener('beforeunload', function() {
      temporaryUrls.forEach(url => URL.revokeObjectURL(url));
    });

  </script>
</body>
</html>
